name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, lint, format, tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Lint (type-aware, zero warnings)
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: No comments in code
        run: npm run check:comments
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080

  image:
    name: Image runs healthy
    needs: verify
    runs-on: ubuntu-24.04
    env:
      VITE_API_URL: http://localhost:8080
      WEB_PORT: "8080"
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and start the web container
        run: docker compose -f compose.deploy.yaml up -d --build --wait --wait-timeout 300
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.deploy.yaml logs
      - name: Tear down
        if: always()
        run: docker compose -f compose.deploy.yaml down

  demo:
    name: Web demo starts with one command
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the web demo
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: The SPA answers 200 with its Content-Security-Policy
        run: |
          for route in / /login /menu; do
            status="$(curl -sS -o page.html -D headers.txt -w '%{http_code}' "http://localhost:5173${route}")"
            echo "${route} -> ${status}"
            test "${status}" = "200"
            grep -q '<div id="root">' page.html
            grep -i '^content-security-policy:' headers.txt | grep -qF "connect-src 'self' http://localhost:8080"
          done
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down

  e2e:
    name: E2E (stubbed network, every viewport)
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run e2e
      - name: Traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
