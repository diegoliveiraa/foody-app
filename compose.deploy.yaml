name: foody-web

services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL in .env}
    image: ${FOODY_APP_IMAGE:-foody-app:latest}
    ports:
      - "${WEB_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-64M}
    restart: unless-stopped
